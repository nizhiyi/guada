name: Build GuaDa AI Electron (Windows x64)

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 60
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: 'npm'

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: npm ci

      - name: Rebuild native modules for Electron
        run: |
          $electronVersion = node -p "require('./package.json').devDependencies.electron"
          npm rebuild --runtime=electron --target=$electronVersion --arch=x64

      - name: Build Electron application
        env:
          WIN_CSC_IDENTITY_AUTO_DISCOVERY: false
          ELECTRON: true
        run: npm run build:electron:package -- --publish never

      - name: Upload Windows build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: GuaDa-AI-Windows-x64
          path: release/GuaDa*.exe
          compression-level: 9
          if-no-files-found: error
