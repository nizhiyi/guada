name: Build GuaDa AI Electron (Windows x64)

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 45
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: 'npm'

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # ✅ 关键：删除了 ilammy/msvc-dev-cmd 步骤
      # node-gyp 会自动检测并使用系统已安装的Visual Studio工具链

      - name: Install dependencies
        run: npm ci

      - name: Rebuild native modules for Electron
        run: |
          $electronVersion = node -p "require('./package.json').devDependencies.electron"
          npm rebuild --runtime=electron --target=$electronVersion --disturl=https://electronjs.org/headers --arch=x64

      - name: Initialize database schema
        run: npm run db:seed:force

      - name: Build Electron application
        run: npm run build:electron

      - name: Upload Windows build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: GuaDa-AI-Windows-x64
          path: release/GuaDa-AI-*.exe
          compression-level: 9
          if-no-files-found: error
