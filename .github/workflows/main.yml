name: Build GuaDa AI Electron (Windows x64)

# 触发条件：推送到main分支、发布tag、PR合并、手动触发
on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 45  # 首次构建约10-30分钟，预留足够时间
    permissions:
      contents: read

    steps:
      # 1. 检出代码
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. 配置Node.js环境（推荐20.x LTS）
      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: 'npm'  # 缓存node_modules，加速后续构建

      # 3. 配置Python环境（用于编译原生模块）
      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # 4. 配置MSVC C++构建工具（关键：解决better-sqlite3等原生模块编译问题）
      - name: Setup MSVC Build Tools (x64)
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
          toolset: '14.3'  # 对应VS2022工具集，与GitHub runner预装版本一致

      # 5. 安装所有依赖（后端+前端）
      - name: Install dependencies
        run: npm ci  # 使用ci比install更严格，确保依赖版本一致

      # 6. 强制重建Electron原生模块（避免版本不匹配）
      - name: Rebuild native modules for Electron
        run: |
          $electronVersion = node -p "require('./package.json').devDependencies.electron"
          npm rebuild --runtime=electron --target=$electronVersion --disturl=https://electronjs.org/headers --arch=x64

      # 7. 初始化数据库（根据部署指南要求）
      - name: Initialize database schema
        run: npm run db:seed:force

      # 8. 构建Electron Windows应用
      - name: Build Electron application
        run: npm run build:electron

      # 9. 上传Windows构建产物（仅保留exe安装包）
      - name: Upload Windows build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: GuaDa-AI-Windows-x64
          path: release/GuaDa-AI-*.exe
          compression-level: 9  # 最高压缩比，减小下载体积
          if-no-files-found: error  # 构建失败时直接报错
